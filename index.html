<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Tuned</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,.65)),
        rgba(0,0,0,.15);
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: white;
      padding: 30px;
      text-shadow: 0 3px 15px rgba(0,0,0,.8);
    }

    .content h1 {
      font-size: clamp(42px, 7vw, 100px);
      font-weight: 800;
      letter-spacing: 5px;
      margin-bottom: 16px;
    }

    .content p {
      font-size: clamp(18px, 2.5vw, 32px);
      letter-spacing: 2px;
      opacity: .95;
    }

    .badge {
      display: inline-block;
      margin-bottom: 22px;
      padding: 9px 18px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 999px;
      background: rgba(0,0,0,.3);
      backdrop-filter: blur(6px);
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .content h1 {
        letter-spacing: 2px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="poster" src="poster.jpg" alt="Poster">
    <div class="overlay"></div>

    <section class="content">
      <div class="badge">Coming Soon</div>
      <h1>STAY TUNED</h1>
      <p>Website is under development</p>
    </section>
  </main>
</body>
</html>
